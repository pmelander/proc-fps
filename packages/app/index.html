<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Null Sector</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="automap" hidden></canvas>
    <p id="notice" class="hud"></p>
    <pre id="hud" class="hud" hidden></pre>
    <pre id="perf" class="hud" hidden></pre>
    <div id="compass" class="hud"><span id="compass-arrow">▲</span><b id="compass-letter">E</b></div>
    <div id="prompt" class="hud" hidden></div>
    <div id="crosshair" class="hud"></div>
    <canvas id="gun"></canvas>
    <canvas id="bolter"></canvas>
    <canvas id="saw"></canvas>
    <canvas id="launcher"></canvas>
    <div id="tint" class="hud"></div>
    <div id="healthbar" class="hud plate">
      <div class="row health"><span class="icon">♥</span><div class="bar"><div class="fill"></div></div><span class="value">100</span></div>
      <div class="row armor" hidden><span class="icon">⛨</span><div class="bar"><div class="fill"></div></div><span class="value">0</span></div>
    </div>
    <div id="powerups" class="hud"></div>
    <div id="bossbar" class="hud" hidden><span class="name"></span><div class="bar"><div class="fill"></div></div></div>
    <div id="banner" class="hud" hidden></div>
    <div id="ammo" class="hud plate">
      <div class="slots"></div>
      <div class="type"><span class="cell"></span><span class="name">Scatter cell</span></div>
      <div class="pips"></div>
      <div class="count"><b>8</b> <span class="size">/ 8</span> <span class="reserve">∞</span></div>
      <div class="grenades"></div>
    </div>
    <div id="keys" class="hud"></div>
    <canvas id="bloodscreen"></canvas>
    <div id="hurt" hidden></div>
    <div id="damage"></div>
    <div id="end" class="screen" hidden></div>
    <div id="title" class="screen" hidden></div>
    <div id="start" class="screen"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

    <style>
      body { margin: 0; padding: 16px; background: #0b0b0c; color: #d8d2c4; font: 13px/1.45 ui-monospace, monospace; }

      th { color: #8f8a80; font-weight: normal; }

  <body>
    <h1>Enemy sprite atlas</h1>
    <p>Rows: grunt, brute, sniper, mini boss, boss (bottom to top). Columns: 8 directions × 4 frames (walk, walk, attack, dead). Eyes tinted red. <code>?seed=&lt;s&gt;&amp;theme=base|tech|hell|crypt</code> breeds a level's mutants.</p>

    <div id="info"></div>
